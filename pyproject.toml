[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guard-core"
version = "3.0.0"
description = "Shared quality and refactoring guards for Python repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/guard_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
