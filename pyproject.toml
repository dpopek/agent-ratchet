[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agent-ratchet"
version = "4.1.0"
description = "Shared quality and refactoring guards for Python repositories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
php = ["tree-sitter==0.25.2", "tree-sitter-php==0.25.1"]
magento = ["agent-ratchet[php]", "defusedxml==0.7.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ratchet", "src/guard_core"]

[project.scripts]
agent-ratchet = "agent_ratchet.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: exercises a real external tool (skipped when it is absent)",
    "bridge: runs the previous release (extracted from its git tag) against this checkout's lock transitions",
]
